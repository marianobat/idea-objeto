<style>
:root{
  --bg:#eef0ec; --panel:#ffffff; --ink:#1f2422; --muted:#65706b; --line:#d3d8d3;
  --desk:#e3e7e2; --idle:#b9c1bc; --told:#d1246f;
  --stock:#1f78b4; --stock-soft:#cfe3f1; --vessel:#8a958f; --rule:#3c4743;
  --ghost:#9aa49f; --focus:#1a6fd1; --warn:#a4361f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a18; --panel:#1e2421; --ink:#e9ece9; --muted:#9ba6a1; --line:#323a36;
    --desk:#252c29; --idle:#4a5550; --told:#ff4f97;
    --stock:#4fa8e8; --stock-soft:#173247; --vessel:#6f7b75; --rule:#c9d1cd;
    --ghost:#5f6b66; --focus:#6aa8ff; --warn:#ff8a70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a18; --panel:#1e2421; --ink:#e9ece9; --muted:#9ba6a1; --line:#323a36;
  --desk:#252c29; --idle:#4a5550; --told:#ff4f97;
  --stock:#4fa8e8; --stock-soft:#173247; --vessel:#6f7b75; --rule:#c9d1cd;
  --ghost:#5f6b66; --focus:#6aa8ff; --warn:#ff8a70; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}
[hidden]{display:none!important}
.wrap{max-width:1120px; margin:0 auto; display:grid; gap:24px}
header h1{font-family:var(--display); font-weight:700; font-size:clamp(1.9rem, 4vw, 2.8rem); line-height:1.05; margin:0; letter-spacing:-0.01em; text-wrap:balance}
header p{margin:6px 0 0; color:var(--muted); font-size:1.05rem; max-width:65ch}
.stage{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:820px){ .stage{grid-template-columns:minmax(0,1fr)} }

.floor{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0}
.vessel{width:100%; height:auto; display:block}
.vessel text{font-family:var(--body); font-size:15px; fill:var(--muted)}
.vessel .lbl{font-weight:700; fill:var(--ink)}
.vessel .wall{fill:none; stroke:var(--vessel); stroke-width:4; stroke-linejoin:round}
.vessel .water{fill:var(--stock); transition:y .2s linear, height .2s linear}
.vessel .flow{fill:none; stroke:var(--stock); stroke-linecap:round; transition:stroke-width .2s linear}
.vessel .flow.cut{stroke-dasharray:2 10}
.vessel .ruleline{stroke:var(--rule); stroke-width:2; stroke-dasharray:7 6}
.vessel .ruletxt{fill:var(--rule); font-weight:700; font-size:13px}
.vessel .ruleon .ruleline{stroke-width:3}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:14px; color:var(--muted); font-size:.92rem}
.legend span{display:inline-flex; align-items:center; gap:7px}
.lg-stock{width:13px; height:13px; border-radius:3px; background:var(--stock); display:inline-block}
.lg-rule{width:22px; height:0; border-top:2px dashed var(--rule); display:inline-block}

.side{display:grid; gap:16px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:14px}
.count{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.count b{font-family:var(--display); font-weight:700; font-size:3rem; line-height:1; color:var(--stock); font-variant-numeric:tabular-nums}
.count span{color:var(--muted)}
.step{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.92rem}
.step strong{color:var(--ink)}
.ctl{display:grid; gap:8px}
.ctl-label{font-weight:700; font-size:1.05rem; display:block}
.dial{display:flex; gap:8px}
.dial button{flex:1; font-family:var(--display); font-weight:700; font-size:1.15rem; padding:11px 0; background:var(--desk); color:var(--ink); border:2px solid transparent; border-radius:10px; cursor:pointer}
.dial button[aria-pressed="true"]{background:var(--told); color:#fff; border-color:var(--told)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; background:var(--desk); border:2px solid transparent; border-radius:10px; padding:12px 14px; color:var(--ink); font:inherit; font-weight:700; font-size:1.05rem; cursor:pointer; text-align:left}
.switch .track{flex:none; width:48px; height:28px; border-radius:14px; background:var(--idle); position:relative; transition:background-color .2s}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--panel); transition:transform .2s}
.switch[aria-pressed="true"] .track{background:var(--rule)}
.switch[aria-pressed="true"] .track::after{transform:translateX(20px)}
.actions{display:flex; gap:10px}
.actions button{flex:1; font:inherit; font-weight:700; font-size:1.05rem; padding:12px; border-radius:10px; cursor:pointer}
#play{background:var(--ink); color:var(--panel); border:2px solid var(--ink)}
#reset{background:transparent; color:var(--ink); border:2px solid var(--line)}
.home{display:inline-block; margin-bottom:10px; color:var(--muted); font-size:.92rem; text-decoration:underline; text-underline-offset:3px}
.home:hover{color:var(--ink)}
button:focus-visible, textarea:focus-visible, .home:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.chart-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.chart-head h2{font-family:var(--display); font-weight:500; font-size:1.1rem; margin:0}
.keys{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
.keys span{display:inline-flex; align-items:center; gap:6px}
.keys i{width:18px; height:3px; border-radius:2px; display:inline-block}
.k-now{background:var(--stock)} .k-prev{background:var(--ghost)}
canvas{width:100%; height:190px; display:block}

.cfg-toggle{justify-self:start; background:none; border:none; color:var(--muted); font:inherit; font-size:.9rem; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px 0}
.cfg{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:12px}
.cfg h2{font-family:var(--display); font-weight:500; font-size:1.1rem; margin:0}
.cfg p{margin:0; color:var(--muted); max-width:65ch}
.cfg textarea{width:100%; min-height:320px; font-family:var(--mono); font-size:.85rem; line-height:1.5; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; resize:vertical}
.cfg .row{display:flex; gap:10px; flex-wrap:wrap}
.cfg .row button{font:inherit; font-weight:700; padding:10px 14px; border-radius:10px; cursor:pointer; background:var(--desk); color:var(--ink); border:2px solid var(--line)}
.cfg .row button.main{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.msg{font-size:.95rem; min-height:1.4em}
.msg.err{color:var(--warn)} .msg.ok{color:var(--muted)}

@media (prefers-reduced-motion: reduce){ .vessel .water,.vessel .flow,.switch .track,.switch .track::after{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="index.html">← Volver al inicio</a>
    <h1 id="titulo"></h1>
    <p id="planteo"></p>
  </header>

  <div class="stage">
    <section class="floor" aria-label="Estado de la simulación">
      <svg class="vessel" viewBox="0 0 560 360" role="img" aria-labelledby="vesselTitle">
        <title id="vesselTitle">Nivel actual</title>
        <defs><clipPath id="inside"><path d="M110 70 L450 70 L410 320 L150 320 Z"/></clipPath></defs>
        <rect class="water" id="water" x="100" y="320" width="360" height="0" clip-path="url(#inside)"/>
        <path class="wall" d="M110 70 L150 320 L410 320 L450 70"/>
        <path class="flow" id="inFlow" d="M40 30 C 120 30, 170 40, 190 110"/>
        <path class="flow" id="outFlow" d="M380 300 C 440 310, 480 330, 530 330"/>
        <text class="lbl" id="inLbl" x="20" y="22"></text>
        <text class="lbl" id="outLbl" x="540" y="356" text-anchor="end"></text>
        <g id="ruleG" hidden>
          <line class="ruleline" id="ruleLine" x1="96" x2="464" y1="200" y2="200"/>
          <text class="ruletxt" id="ruleTxt" x="280" y="194" text-anchor="middle"></text>
        </g>
        <text id="capTxt" x="280" y="58" text-anchor="middle"></text>
        <text id="zeroTxt" x="140" y="336" text-anchor="end">0</text>

      <div class="legend">
        <span><i class="lg-stock"></i><span id="lgStock"></span></span>
        <span id="legRule" hidden><i class="lg-rule"></i><span id="lgRule"></span></span>

    <div class="side">
      <div class="card">
        <div class="count"><b id="n">0</b><span id="contador"></span></div>

      </div>
      <div class="card">
        <div class="ctl">
          <span class="ctl-label" id="inLabel"></span>
          <div class="dial" role="group" aria-labelledby="inLabel" id="dialIn"></div>
        </div>
        <div class="ctl">
          <span class="ctl-label" id="outLabel"></span>
          <div class="dial" role="group" aria-labelledby="outLabel" id="dialOut"></div>
        </div>
        <button type="button" class="switch" id="rule" aria-pressed="false">
          <span id="botonTexto"></span>
          <span class="track" aria-hidden="true"></span>

        <div class="actions">
          <button type="button" id="play">Empezar</button>
          <button type="button" id="reset">Reiniciar</button>
        </div>
      </div>
      <div class="card">
        <div class="chart-head">
          <h2 id="grafico"></h2>
          <div class="keys">
            <span><i class="k-now"></i>Ahora</span>
            <span id="keyPrev" hidden><i class="k-prev"></i><span id="prevLabel">Anterior</span></span>
          </div>
        </div>
        <canvas id="chart" aria-label="Gráfico de la evolución en el tiempo"></canvas>
      </div>
    </div>
  </div>

  <button type="button" class="cfg-toggle" id="cfgToggle">Configuración</button>
  <section class="cfg" id="cfg" hidden aria-label="Configuración del simulador">
    <h2>Configuración</h2>
    <p>Pegá acá la configuración que te dio la IA y tocá Aplicar. Para conservar tu simulador, tocá Descargar: se guarda un archivo nuevo que podés abrir sin conexión.</p>
    <textarea id="cfgText" spellcheck="false" aria-label="Texto de configuración"></textarea>
    <div class="row">
      <button type="button" class="main" id="cfgApply">Aplicar</button>
      <button type="button" id="cfgSave">Descargar este simulador</button>
      <button type="button" id="cfgOrig">Volver a la original</button>
    </div>
    <div class="msg" id="cfgMsg" role="status"></div>
  </section>
</div>

<script>
(function(){
  // ===== Motor. No hace falta modificar nada de acá para abajo. =====
  const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
  const ORIGINAL_TEXT = document.getElementById('config').textContent.trim();
  const TICK=200;
  // Configuración de respaldo, por si la del archivo tiene errores
  const DEFAULT={
  "titulo": "El embalse",
  "planteo": "Un embalse abastece a una ciudad. Hoy está al 60 % de su capacidad.",
  "unidadTiempo": "Semana",
  "duracion": 120,
  "stock": {
    "nombre": "Agua en el embalse",
    "unidad": "%",
    "capacidad": 100,
    "inicial": 60
  },
  "contador": "de la capacidad",
  "grafico": "Nivel del embalse, semana a semana",
  "entrada": {
    "nombre": "Lluvia",
    "pregunta": "Cuánto llueve",
    "forma": "fija",
    "variacion": "estacional",
    "ciclo": 52,
    "valores": [1, 2, 3],
    "etiquetas": ["Poco", "Normal", "Mucho"],
    "inicial": 2,
    "resumen": "llueve {valor}"
  },
  "salida": {
    "nombre": "Consumo",
    "pregunta": "Consumo de la ciudad",
    "forma": "fija",
    "valores": [1.5, 2, 2.5],
    "etiquetas": ["Bajo", "Normal", "Alto"],
    "inicial": 2,
    "resumen": "consumo {valor}"
  },
  "boton": {
    "texto": "Si baja del 25 %, se restringe el consumo",
    "cuando": "debajo",
    "umbral": 25,
    "afecta": "salida",
    "factor": 0.4,
    "resumenEncendido": "con restricción",
    "resumenApagado": "sin restricción"
  },
  "indicador": {
    "cuenta": "vacio",
    "texto": "semanas con el embalse vacío"
  }
};
  const $=id=>document.getElementById(id);

  // ---- Validación ----
  const isText=(v,max)=>typeof v==='string'&&v.trim().length>0&&v.length<=max;
  const isNum=v=>typeof v==='number'&&isFinite(v);
  function checkFlow(f,key,cap,e,canVary){
    if(!f||typeof f!=='object'){e.push('Falta "'+key+'".');return;}
    if(!isText(f.nombre,24)) e.push('Falta "'+key+'.nombre" (hasta 24 caracteres).');
    if(!isText(f.pregunta,50)) e.push('Falta "'+key+'.pregunta" (hasta 50 caracteres).');
    if(f.forma!=='fija'&&f.forma!=='proporcional') e.push('"'+key+'.forma" tiene que ser "fija" o "proporcional".');
    if(!Array.isArray(f.valores)||f.valores.length<2||f.valores.length>4||!f.valores.every(v=>isNum(v)&&v>0)) e.push('"'+key+'.valores" tiene que ser una lista de 2 a 4 números positivos.');
    else if(f.forma==='fija'&&!f.valores.every(v=>v<=cap/4)) e.push('Con forma "fija", los valores de "'+key+'" no pueden superar un cuarto de la capacidad por '+'unidad de tiempo.');
    else if(f.forma==='proporcional'&&!f.valores.every(v=>v<=50)) e.push('Con forma "proporcional", los valores de "'+key+'" son porcentajes del nivel, hasta 50.');
    if(!Array.isArray(f.etiquetas)||!Array.isArray(f.valores)||f.etiquetas.length!==f.valores.length||!f.etiquetas.every(t=>isText(t,10))) e.push('"'+key+'.etiquetas" tiene que tener una palabra corta por cada valor.');
    if(Array.isArray(f.valores)&&!f.valores.includes(f.inicial)) e.push('"'+key+'.inicial" tiene que ser uno de los valores.');
    if(!isText(f.resumen,40)||f.resumen.indexOf('{valor}')<0) e.push('"'+key+'.resumen" tiene que incluir {valor}.');
    if(canVary){
      if(!['constante','estacional','irregular'].includes(f.variacion)) e.push('"'+key+'.variacion" tiene que ser "constante", "estacional" o "irregular".');
      if(f.variacion==='estacional'&&!(Number.isInteger(f.ciclo)&&f.ciclo>=4&&f.ciclo<=120)) e.push('Con variación "estacional", "'+key+'.ciclo" es un entero de 4 a 120.');
    }
  }
  function validate(c){
    const e=[];
    if(!c||typeof c!=='object') return ['La configuración no tiene el formato esperado.'];
    if(!isText(c.titulo,80)) e.push('Falta "titulo" (hasta 80 caracteres).');
    if(!isText(c.planteo,160)) e.push('Falta "planteo" (hasta 160 caracteres).');
    if(!isText(c.unidadTiempo,20)) e.push('Falta "unidadTiempo", por ejemplo "Día" o "Semana".');
    if(!(Number.isInteger(c.duracion)&&c.duracion>=20&&c.duracion<=240)) e.push('"duracion" es un entero de 20 a 240.');
    const s=c.stock||{};
    if(!isText(s.nombre,40)) e.push('Falta "stock.nombre" (hasta 40 caracteres).');
    if(typeof s.unidad!=='string'||s.unidad.length>12) e.push('"stock.unidad" es un texto corto, por ejemplo "%" o "litros".');
    if(!isNum(s.capacidad)||s.capacidad<=0) e.push('"stock.capacidad" tiene que ser un número positivo.');
    if(!isNum(s.inicial)||s.inicial<0||s.inicial>s.capacidad) e.push('"stock.inicial" va de 0 a la capacidad.');
    if(!isText(c.contador,50)) e.push('Falta "contador" (hasta 50 caracteres).');
    if(!isText(c.grafico,60)) e.push('Falta "grafico" (hasta 60 caracteres).');
    checkFlow(c.entrada,'entrada',s.capacidad,e,true);
    checkFlow(c.salida,'salida',s.capacidad,e,false);
    const b=c.boton||{};
    if(!isText(b.texto,60)) e.push('Falta "boton.texto" (hasta 60 caracteres).');
    if(b.cuando!=='debajo'&&b.cuando!=='encima') e.push('"boton.cuando" tiene que ser "debajo" o "encima".');
    if(!isNum(b.umbral)||b.umbral<=0||b.umbral>=s.capacidad) e.push('"boton.umbral" tiene que estar entre 0 y la capacidad.');
    if(b.afecta!=='entrada'&&b.afecta!=='salida') e.push('"boton.afecta" tiene que ser "entrada" o "salida".');
    if(!isNum(b.factor)||b.factor<0||b.factor>5||b.factor===1) e.push('"boton.factor" va de 0 a 5 y no puede ser 1 (0 corta el flujo, 0.5 lo reduce a la mitad, 2 lo duplica).');
    if(!isText(b.resumenEncendido,40)||!isText(b.resumenApagado,40)) e.push('Faltan "boton.resumenEncendido" o "boton.resumenApagado".');
    const d=c.indicador||{};
    if(!['vacio','lleno','ninguno'].includes(d.cuenta)) e.push('"indicador.cuenta" tiene que ser "vacio", "lleno" o "ninguno".');
    if(d.cuenta!=='ninguno'&&!isText(d.texto,60)) e.push('Falta "indicador.texto" (hasta 60 caracteres).');
    return e;
  }

  // ---- Estado ----
  let C, S, series, step, timer=null, vin, vout, rule=false, prev=null, done=false, counted, weather=[], inNow=0, outNow=0, ruleActive=false;

  function weatherFor(cfg){
    // La lluvia irregular se sortea una vez por configuración, así las corridas se comparan con el mismo clima
    const w=[]; for(let t=0;t<=cfg.duracion;t++) w.push(Math.random()<0.25?3.4:0.2); return w;
  }
  function variation(t){
    const f=C.entrada;
    if(f.variacion==='estacional') return 1+0.8*Math.sin(2*Math.PI*t/f.ciclo);
    if(f.variacion==='irregular') return weather[t];
    return 1;
  }
  function flowValue(f,v,level){return f.forma==='proporcional'?level*v/100:v;}
  function ruleOn(level){if(!rule)return false;return C.boton.cuando==='debajo'?level<C.boton.umbral:level>C.boton.umbral;}

  function setup(){
    S=C.stock.inicial; step=0; done=false; counted=0; series=[S]; inNow=0; outNow=0; ruleActive=false;
    $('play').textContent='Empezar';
    render(); updateNumbers(); drawChart();
  }
  function tick(){
    if(step>=C.duracion){finish();return;}
    step++;
    let i=flowValue(C.entrada,vin,S)*variation(step);
    let o=flowValue(C.salida,vout,S);
    ruleActive=ruleOn(S);
    if(ruleActive){ if(C.boton.afecta==='entrada') i*=C.boton.factor; else o*=C.boton.factor; }
    const cap=C.stock.capacidad;
    inNow=i; outNow=Math.min(o, S+i); // lo que efectivamente salió
    S=Math.max(0,Math.min(cap,S+i-o));
    if(C.indicador.cuenta==='vacio'&&S<=cap*0.001) counted++;
    if(C.indicador.cuenta==='lleno'&&S>=cap*0.999) counted++;
    series.push(S);
    render(); updateNumbers(); drawChart();
    if(step>=C.duracion)finish();
  }
  function finish(){done=true;stop();$('play').textContent='Terminó';}
  function start(){if(done)return;timer=setInterval(tick,TICK);$('play').textContent='Pausa';}
  function stop(){clearInterval(timer);timer=null;if(!done)$('play').textContent=step?'Seguir':'Empezar';}

  function fmtNum(v){const cap=C.stock.capacidad;const d=cap<=10?1:0;return v.toLocaleString('es-AR',{maximumFractionDigits:d,minimumFractionDigits:0});}
  function withUnit(v){return fmtNum(v)+(C.stock.unidad?(C.stock.unidad==='%'?' %':' '+C.stock.unidad):'');}
  function updateNumbers(){
    $('n').textContent=withUnit(S);
    $('step').textContent=C.unidadTiempo+' '+step;
    $('indic').textContent=C.indicador.cuenta==='ninguno'?'':' · '+counted+' '+C.indicador.texto;
  }

  // ---- Dibujo del recipiente ----
  const TOP=70, BOT=320;
  function levelY(v){return BOT-(BOT-TOP)*v/C.stock.capacidad;}
  function maxFlow(f){return f.forma==='proporcional'?C.stock.capacidad*Math.max(...f.valores)/100:Math.max(...f.valores)*(f.variacion==='irregular'?3.4:1.8);}
  function render(){
    const y=levelY(S); $('water').setAttribute('y',y); $('water').setAttribute('height',BOT-y+2);
    const wIn=step?3+20*Math.min(1,inNow/maxFlow(C.entrada)):3+20*Math.min(1,flowValue(C.entrada,vin,S)/maxFlow(C.entrada));
    const wOut=step?3+20*Math.min(1,outNow/maxFlow(C.salida)):3+20*Math.min(1,flowValue(C.salida,vout,S)/maxFlow(C.salida));
    $('inFlow').style.strokeWidth=wIn; $('outFlow').style.strokeWidth=wOut;
    const cut=ruleActive&&C.boton.factor<1;
    $('inFlow').classList.toggle('cut',cut&&C.boton.afecta==='entrada');
    $('outFlow').classList.toggle('cut',cut&&C.boton.afecta==='salida');
    if(rule)$('ruleG').removeAttribute('hidden'); else $('ruleG').setAttribute('hidden',''); $('legRule').hidden=!rule;
    if(rule){const ry=levelY(C.boton.umbral);$('ruleLine').setAttribute('y1',ry);$('ruleLine').setAttribute('y2',ry);
      $('ruleTxt').setAttribute('y',ry-8);$('ruleTxt').textContent=withUnit(C.boton.umbral);
      $('ruleG').classList.toggle('ruleon',ruleActive);}
  }

  function label(){
    const tag=(f,v)=>f.etiquetas[f.valores.indexOf(v)].toLowerCase();
    return C.entrada.resumen.replace('{valor}',tag(C.entrada,vin))+' · '+C.salida.resumen.replace('{valor}',tag(C.salida,vout))+' · '+(rule?C.boton.resumenEncendido:C.boton.resumenApagado);
  }
  function archive(){
    if(series&&series.length>1){prev={series:series.slice(),label:label()};
      $('keyPrev').hidden=false; $('prevLabel').textContent='Anterior: '+prev.label;}
  }
  function buildDial(el,f,get,set){
    el.innerHTML='';
    f.valores.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.id=el.id+i;
      b.textContent=f.etiquetas[i]; b.setAttribute('aria-pressed',v===get()?'true':'false');
      b.addEventListener('click',()=>{set(v);el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));if(!step)render();});
      el.appendChild(b);});
  }

  function apply(cfg){
    stop(); C=cfg; vin=C.entrada.inicial; vout=C.salida.inicial; rule=false; prev=null; weather=weatherFor(C);
    document.title=C.titulo;
    $('titulo').textContent=C.titulo; $('planteo').textContent=C.planteo;
    $('lgStock').textContent=C.stock.nombre; $('lgRule').textContent=C.boton.texto;
    $('contador').textContent=C.contador; $('grafico').textContent=C.grafico;
    $('inLabel').textContent=C.entrada.pregunta; $('outLabel').textContent=C.salida.pregunta;
    $('inLbl').textContent=C.entrada.nombre; $('outLbl').textContent=C.salida.nombre;
    $('capTxt').textContent='Máximo: '+withUnit(C.stock.capacidad);
    $('botonTexto').textContent=C.boton.texto; $('rule').setAttribute('aria-pressed','false');
    $('keyPrev').hidden=true;
    buildDial($('dialIn'),C.entrada,()=>vin,v=>vin=v);
    buildDial($('dialOut'),C.salida,()=>vout,v=>vout=v);
    setup();
  }

  $('play').addEventListener('click',()=>{if(done)return;timer?stop():start();});
  $('reset').addEventListener('click',()=>{stop();archive();setup();});
  $('rule').addEventListener('click',e=>{rule=!rule;e.currentTarget.setAttribute('aria-pressed',rule?'true':'false');if(!step)render();});

  // ---- Gráfico ----
  const cv=$('chart'), ctx=cv.getContext('2d');
  function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
  function drawChart(){
    const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w)return;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const cap=C.stock.capacidad, padL=40,padR=10,padT=10,padB=26, pw=w-padL-padR, ph=h-padT-padB;
    const xMax=C.duracion;
    const X=s=>padL+pw*s/xMax, Y=v=>padT+ph*(1-v/cap);
    ctx.font='12px '+tok('--body'); ctx.fillStyle=tok('--muted'); ctx.strokeStyle=tok('--line'); ctx.lineWidth=1;
    [0,cap/2,cap].forEach(v=>{ctx.beginPath();ctx.moveTo(padL,Y(v));ctx.lineTo(w-padR,Y(v));ctx.stroke();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(fmtNum(v),padL-6,Y(v));});
    ctx.textAlign='center';ctx.textBaseline='top';
    const tickStep=xMax>120?40:xMax>60?20:10;
    for(let s=0;s<=xMax;s+=tickStep)ctx.fillText(s===0?C.unidadTiempo.toLowerCase()+' 0':s,X(s),h-padB+7);
    if(rule){ctx.strokeStyle=tok('--rule');ctx.setLineDash([6,5]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(padL,Y(C.boton.umbral));ctx.lineTo(w-padR,Y(C.boton.umbral));ctx.stroke();ctx.setLineDash([]);}
    function line(d,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.beginPath();d.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();}
    if(prev){ctx.setLineDash([5,4]);line(prev.series,tok('--ghost'),2);ctx.setLineDash([]);}
    line(series,tok('--stock'),3);
    const last=series.length-1; ctx.fillStyle=tok('--stock'); ctx.beginPath(); ctx.arc(X(last),Y(series[last]),4.5,0,7); ctx.fill();
  }
  window.addEventListener('resize',drawChart);
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawChart);}catch(e){}
  new MutationObserver(drawChart).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // ---- Panel de configuración ----
  const msg=(t,err)=>{$('cfgMsg').textContent=t;$('cfgMsg').className='msg '+(err?'err':'ok');};
  function readPanel(){
    let txt=$('cfgText').value.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
    let cfg; try{cfg=JSON.parse(txt);}catch(e){msg('El texto no se pudo leer. Revisá que esté completo, desde la primera llave { hasta la última }.',true);return null;}
    const errs=validate(cfg); if(errs.length){msg(errs.join(' '),true);return null;}
    return {cfg};
  }
  $('cfgToggle').addEventListener('click',()=>{const p=$('cfg');p.hidden=!p.hidden;if(!p.hidden)$('cfgText').value=JSON.stringify(C,null,2);});
  $('cfgApply').addEventListener('click',()=>{const r=readPanel();if(!r)return;apply(r.cfg);msg('Listo. Ya estás usando la nueva configuración. Si cerrás la página se pierde: descargala para conservarla.');});
  $('cfgOrig').addEventListener('click',()=>{apply(JSON.parse(ORIGINAL_TEXT));$('cfgText').value=JSON.stringify(C,null,2);msg('Volviste a la configuración original del archivo.');});
  $('cfgSave').addEventListener('click',()=>{
    const r=readPanel();if(!r)return; apply(r.cfg);
    const html=PRISTINE.replace(/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/,'$1\n'+JSON.stringify(r.cfg,null,2)+'\n$2');
    try{
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      a.download=r.cfg.titulo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html';
      document.body.appendChild(a); a.click(); a.remove();
      msg('Se descargó el archivo '+a.download+'. Abrilo con el navegador, funciona sin conexión.');
    }catch(e){msg('Este navegador no permitió la descarga. Copiá el texto de configuración y guardalo.',true);}
  });

  // ---- Arranque ----
  let initial;
  try{initial=JSON.parse(ORIGINAL_TEXT);}catch(e){initial=null;}
  const errs=initial?validate(initial):['La configuración del archivo no se pudo leer.'];
  if(errs.length){
    document.body.insertAdjacentHTML('afterbegin','<p style="color:var(--warn);font-weight:700;max-width:1120px;margin:0 auto 16px">Hay un problema en la configuración de este archivo: '+errs.join(' ').replace(/</g,'&lt;')+' Abrí Configuración, abajo de todo, para corregirla.</p>');
    initial=DEFAULT;
  }
  apply(initial);
})();
</script>
</body>
</html>
