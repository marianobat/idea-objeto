    if (T <= 5 && P > 7 && D > 7) return stateOf('ideal');
    if (P < 4) return stateOf('impuesto');
    if (T >= 6 && P >= 4) return stateOf('exigente');
    if (T <= 5 && P > 7) return stateOf('consolidacion');
    const t = (T - 1) / 9, p = (P - 1) / 9, d = (D - 1) / 9;
    const scores = [['part', p], ['time', d], ['tech', 1 - t]];
    const weakest = scores.reduce(function (a, b) { return b[1] < a[1] ? b : a; })[0];
    const base = C.construccion;
    return {
      key: 'construccion',
      emoji: base.emoji,
      title: base.title,
      tone: base.tone,
      tag: base.tag,
      diagnosis: base[weakest].diagnosis,
      reflection: base[weakest].reflection
    };
  }
  function evaluate(inputs) {
    const T = inputs.tech, P = inputs.part, D = inputs.time;
    const t = (T - 1) / 9, p = (P - 1) / 9, d = (D - 1) / 9;
    const elefante = T > 7 && P < 4;
    const parche = P >= 7 && D < 3;
    let adoption = p * (0.6 + 0.2 * d + 0.2 * (1 - t));
    let sustain = Math.pow((0.1 + 0.9 * d) * (0.5 * p + 0.3 * (1 - t) + 0.2), 0.8);
    if (elefante) {
      adoption *= 0.35;
      sustain *= 0.5;
    }
    let risk = 1 - Math.pow((adoption + sustain) / 2, 0.8) + 0.15 * t * (1 - p) + 0.1 * t;
    if (elefante) risk = Math.max(risk, 0.92);
    if (parche) risk = Math.max(risk, 0.68);
    risk = Math.min(Math.max(risk, 0.05), 0.98);
    return {
      risk: Math.round(clamp(risk * 100)),
      adoption: Math.round(clamp(adoption * 100)),
      sustain: Math.round(clamp(sustain * 100)),
      state: pickState(inputs)
    };
  }

  function tierText(control, value) {
    const niveles = control.niveles;
    for (let i = 0; i < niveles.length; i++) {
      if (value <= niveles[i].hasta) return niveles[i].texto;
    }
    return niveles[niveles.length - 1].texto;
  }
  function band(value) {
    if (value >= 70) return 'alto';
    if (value >= 35) return 'medio';
    return 'bajo';
  }
  function toneFor(meter, level) {
    if (meter.inverso) {
      if (level === 'alto') return 'bad';
      if (level === 'medio') return 'warn';
      return 'good';
    }
    if (level === 'alto') return 'good';
    if (level === 'medio') return 'warn';
    return 'bad';
  }

  function paintControl(id) {
    const value = values[id];
    const control = C.controles.filter(function (item) { return item.id === id; })[0];
    const texto = tierText(control, value);
    $('val-' + id).textContent = String(value);
    $('tier-' + id).textContent = texto;
    const range = $('range-' + id);
    range.value = String(value);
    range.style.setProperty('--f', String((value - 1) / 9));
    range.setAttribute('aria-valuenow', String(value));
    range.setAttribute('aria-valuetext', value + ' de 10. ' + texto);
    for (let n = 1; n <= 10; n++) $('tick-' + id + '-' + n).classList.toggle('on', n === value);
  }
  function paintStatus(state) {
    const sig = state.key + '\n' + state.diagnosis;
    if (sig === statusSig) return;
    statusSig = sig;
    $('status').replaceChildren(h('section', {
      class: 'tone-' + state.tone + ' status' + (state.key === 'elefante' ? ' shake' : '')
    }, [
      h('p', { class: 'eyebrow', text: 'Estado del proyecto' }),
      h('div', { class: 'status-row' }, [
        h('div', { class: 'emoji emoji-pop', 'aria-hidden': 'true', text: state.emoji }),
        h('div', null, [
          h('h2', { text: state.title }),
          h('span', { class: 'tag', text: state.tag })
        ])
      ]),
      h('p', { class: 'diagnosis', text: state.diagnosis }),
      h('div', { class: 'reflect' }, [
        h('p', { class: 'eyebrow', text: 'Para reflexionar' }),
        h('p', { class: 'q', text: state.reflection })
      ])
    ]));
  }
  function paintMeters(result) {
    C.medidores.forEach(function (meter) {
      const value = result[meter.id];
      const level = band(value);
      const gauge = $('gauge-' + meter.id);
      gauge.className = 'tone-' + toneFor(meter, level) + ' gauge';
      $('num-' + meter.id).textContent = String(value);
      $('band-' + meter.id).textContent = level;
      const bar = $('meter-' + meter.id);
      bar.setAttribute('aria-valuenow', String(value));
      bar.setAttribute('aria-valuetext', value + ' por ciento, nivel ' + level);
      const lit = Math.round(value / 100 * 20);
      for (let i = 0; i < 20; i++) $('seg-' + meter.id + '-' + i).setAttribute('data-lit', i < lit ? 'true' : 'false');
    });
  }
  function refresh() {
    const result = evaluate(values);
    paintStatus(result.state);
    paintMeters(result);
  }
  function buildControls() {
    const list = $('controlList');
    list.replaceChildren();
    C.controles.forEach(function (control) {
      const id = control.id;
      const value = values[id];
      const ticks = h('div', { class: 'ticks', 'aria-hidden': 'true' });
      for (let n = 1; n <= 10; n++) {
        ticks.appendChild(h('span', {
          id: 'tick-' + id + '-' + n,
          class: n === value ? 'on' : '',
          style: 'left:calc(11px + (100% - 22px) * ' + ((n - 1) / 9) + ')',
          text: String(n)
        }));
      }
      const range = h('input', {
        id: 'range-' + id,
        class: 'range',
        type: 'range',
        min: '1',
        max: '10',
        step: '1',
        value: String(value),
        'aria-valuemin': '1',
        'aria-valuemax': '10',
        'aria-valuenow': String(value),
        'aria-valuetext': value + ' de 10. ' + tierText(control, value)
      });
      range.style.setProperty('--f', String((value - 1) / 9));
      range.addEventListener('input', function () {
        values[id] = Number(range.value);
        paintControl(id);
        refresh();
      });
      list.appendChild(h('div', { class: 'ctl' }, [
        h('div', { class: 'ctl-top' }, [
          h('label', { for: 'range-' + id, class: 'ctl-label', text: control.label }),
          h('output', { for: 'range-' + id, class: 'ctl-value' }, [
            h('span', { id: 'val-' + id, text: String(value) }),
            h('span', { class: 'unit', text: '/10' })
          ])
        ]),
        h('p', { id: 'tier-' + id, class: 'tier', text: tierText(control, value) }),
        range,
        ticks,
        h('div', { class: 'ends' }, [
          h('span', null, [h('b', { text: '1' }), ' ' + control.low]),
          h('span', { class: 'right' }, [h('b', { text: '10' }), ' ' + control.high])
        ])
      ]));
    });
  }
  function buildMeters() {
    const list = $('meters');
    list.replaceChildren();
    C.medidores.forEach(function (meter) {
      const segs = h('div', {
        id: 'meter-' + meter.id,
        role: 'meter',
        class: 'segs',
        'aria-label': meter.label,
        'aria-valuemin': '0',
        'aria-valuemax': '100',
        'aria-valuenow': '0'
      });
      for (let i = 0; i < 20; i++) {
        segs.appendChild(h('span', {
          id: 'seg-' + meter.id + '-' + i,
          class: 'seg',
          style: 'transition-delay:' + (i * 8) + 'ms'
        }));
      }
      list.appendChild(h('div', { id: 'gauge-' + meter.id, class: 'gauge' }, [
        h('div', { class: 'meter-top' }, [
          h('div', null, [
            h('p', { class: 'meter-name', text: meter.label }),
            h('p', { class: 'meter-sub', text: meter.sub })
          ]),
          h('div', { class: 'meter-score' }, [
            h('span', { id: 'band-' + meter.id, class: 'band-pill', text: '' }),
            h('span', { class: 'meter-num' }, [
              h('span', { id: 'num-' + meter.id, text: '0' }),
              h('span', { class: 'unit', text: '%' })
            ])
          ])
        ]),
        segs,
        h('div', { class: 'scale', 'aria-hidden': 'true' }, [
          h('span', { text: '0' }), h('span', { text: '25' }), h('span', { text: '50' }), h('span', { text: '75' }), h('span', { text: '100' })
        ])
      ]));
    });
  }

  let onModalKey = null;
  function closeTheory() {
    const modal = $('modal');
    if (onModalKey) document.removeEventListener('keydown', onModalKey);
    onModalKey = null;
    modal.hidden = true;
    modal.replaceChildren();
    document.body.style.overflow = '';
    $('openTheory').focus();
  }
  function openTheory() {
    const t = C.teoria;
    const modal = $('modal');
    const close = h('button', { type: 'button', class: 'btn-ghost', 'aria-label': 'Cerrar marco teórico', text: 'Cerrar' });
    close.addEventListener('click', closeTheory);
    const principles = h('div', { class: 'principles' });
    t.principios.forEach(function (p) {
      principles.appendChild(h('div', { class: 'principle' }, [
        h('h3', { text: p.titulo }),
        h('p', { text: p.texto })
      ]));
    });
    const rules = h('dl');
    t.reglas.forEach(function (r) {
      rules.appendChild(h('div', { class: 'rule' }, [
        h('dt', { text: r.nombre }),
        h('dd', { text: r.condicion })
      ]));
    });
    modal.replaceChildren(h('div', {
      class: 'modal-panel',
      role: 'dialog',
      'aria-modal': 'true',
      'aria-labelledby': 'theory-title'
    }, [
      h('div', { class: 'modal-head' }, [
        h('div', null, [
          h('p', { class: 'eyebrow', text: t.eyebrow }),
          h('h2', { id: 'theory-title', text: t.titulo })
        ]),
        close
      ]),
      h('p', { class: 'intro', text: t.intro }),
      principles,
      h('div', { class: 'callout' }, [
        h('h3', { text: t.solucionismoTitulo }),
        h('p', { text: t.solucionismo })
      ]),
      h('h3', { text: t.modeloTitulo }),
      rules,
      h('p', { class: 'nota', text: t.nota })
    ]));
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    close.focus();
    onModalKey = function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); closeTheory(); return; }
      if (ev.key !== 'Tab') return;
      const items = modal.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onModalKey);
  }

  function apply(cfg) {
    if (!modalHidden()) closeTheory();
    C = cfg;
    values = { tech: cfg.inicial.tech, part: cfg.inicial.part, time: cfg.inicial.time };
    statusSig = '';
    document.title = cfg.titulo;
    $('eyebrow').textContent = cfg.eyebrow;
    $('titulo').textContent = cfg.titulo;
    $('bajada').textContent = cfg.bajada;
    $('openTheory').textContent = cfg.botonTeoria;
    $('controlsTitle').textContent = cfg.controlesTitulo;
    $('controlsNote').textContent = cfg.controlesNota;
    $('dashTitle').textContent = cfg.dashboardTitulo;
    $('dashNote').textContent = cfg.dashboardNota;
    buildControls();
    buildMeters();
    refresh();
  }
  function modalHidden() { return $('modal').hidden; }

  $('openTheory').addEventListener('click', openTheory);
  $('modal').addEventListener('mousedown', function (ev) {
    if (ev.target === ev.currentTarget) closeTheory();
  });

  const msg = function (text, err) {
    $('cfgMsg').textContent = text;
    $('cfgMsg').className = 'msg ' + (err ? 'err' : 'ok');
  };
  function readPanel() {
    let txt = $('cfgText').value.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
    let cfg;
    try { cfg = JSON.parse(txt); }
    catch (e) { msg('El texto no se pudo leer. Revisá que esté completo, desde la primera llave { hasta la última }.', true); return null; }
    const errs = validate(cfg);
    if (errs.length) { msg(errs.join(' '), true); return null; }
    return { cfg: cfg };
  }
  $('cfgToggle').addEventListener('click', function () {
    const panel = $('cfg');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) $('cfgText').value = C ? JSON.stringify(C, null, 2) : ORIGINAL_TEXT;
  });
  $('cfgApply').addEventListener('click', function () {
    const read = readPanel();
    if (!read) return;
    apply(read.cfg);
    msg('Listo. Ya estás usando la nueva configuración. Si cerrás la página se pierde: descargala para conservarla.');
  });
  $('cfgOrig').addEventListener('click', function () {
    let cfg;
    try { cfg = JSON.parse(ORIGINAL_TEXT); }
    catch (e) { msg('La configuración original de este archivo no se pudo leer.', true); return; }
    const errs = validate(cfg);
    if (errs.length) { msg(errs.join(' '), true); return; }
    apply(cfg);
    $('cfgText').value = JSON.stringify(cfg, null, 2);
    msg('Volviste a la configuración original del archivo.');
  });
  $('cfgSave').addEventListener('click', function () {
    const read = readPanel();
    if (!read) return;
    apply(read.cfg);
    const html = PRISTINE.replace(/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/, '$1\n' + JSON.stringify(read.cfg, null, 2) + '\n$2');
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = read.cfg.titulo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      msg('Se descargó el archivo ' + a.download + '. Abrilo con el navegador, funciona sin conexión.');
    } catch (e) {
      msg('Este navegador no permitió la descarga. Copiá el texto de configuración y guardalo.', true);
    }
  });

  function banner(errs) {
    const p = document.createElement('p');
    p.className = 'banner';
    p.textContent = 'Hay un problema en la configuración de este archivo: ' + errs.join(' ') + ' Abrí Configuración, abajo de todo, para corregirla.';
    document.body.insertBefore(p, document.body.firstChild);
  }
  function parseCfg(text) {
    try { return JSON.parse(text); }
    catch (e) { return null; }
  }

  let initial = parseCfg(ORIGINAL_TEXT);
  const errs = initial ? validate(initial) : ['La configuración del archivo no se pudo leer.'];
  if (errs.length) {
    banner(errs);
    $('cfg').hidden = false;
    $('cfgText').value = ORIGINAL_TEXT;
    const fallback = parseCfg(DEFAULT_TEXT);
    const fallbackErrs = fallback ? validate(fallback) : ['El respaldo no se pudo leer.'];
    if (!fallbackErrs.length) apply(fallback);
  } else {
    apply(initial);
  }
})();
</script>
</body>
</html>
