<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef0ec; --panel:#ffffff; --ink:#1f2422; --muted:#65706b; --line:#d3d8d3;
  --desk:#e3e7e2; --idle:#b9c1bc; --told:#d1246f; --told-soft:#f6d3e2; --spent:#e79bbd;
  --skeptic:#3c4743; --ghost:#9aa49f; --focus:#1a6fd1; --warn:#a4361f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a18; --panel:#1e2421; --ink:#e9ece9; --muted:#9ba6a1; --line:#323a36;
    --desk:#252c29; --idle:#4a5550; --told:#ff4f97; --told-soft:#4a2134; --spent:#8a3d60;
    --skeptic:#c9d1cd; --ghost:#5f6b66; --focus:#6aa8ff; --warn:#ff8a70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a18; --panel:#1e2421; --ink:#e9ece9; --muted:#9ba6a1; --line:#323a36;
  --desk:#252c29; --idle:#4a5550; --told:#ff4f97; --told-soft:#4a2134; --spent:#8a3d60;
  --skeptic:#c9d1cd; --ghost:#5f6b66; --focus:#6aa8ff; --warn:#ff8a70; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}
[hidden]{display:none!important}
.wrap{max-width:1120px; margin:0 auto; display:grid; gap:24px}
header h1{font-family:var(--display); font-weight:700; font-size:clamp(1.9rem, 4vw, 2.8rem); line-height:1.05; margin:0; letter-spacing:-0.01em; text-wrap:balance}
header p{margin:6px 0 0; color:var(--muted); font-size:1.05rem}
.stage{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:820px){ .stage{grid-template-columns:minmax(0,1fr)} }

.floor{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0}
.grid{display:grid; gap:6px; grid-template-columns:repeat(14, minmax(0,1fr))}
.desk{aspect-ratio:1; max-width:100%; background:var(--desk); border-radius:6px; display:grid; place-items:center}
.p{width:58%; height:58%; border-radius:50%; background:var(--idle); transition:background-color .35s ease, transform .35s ease, box-shadow .35s ease; position:relative}
.p.k{background:var(--told); box-shadow:0 0 0 4px var(--told-soft)}
.p.x{background:var(--spent)}
.p.new{transform:scale(1.25)}
.p.s{background:transparent; border:2.5px solid var(--skeptic)}
.p.s::before,.p.s::after{content:""; position:absolute; left:50%; top:50%; width:62%; height:2.5px; background:var(--skeptic); border-radius:2px; transform:translate(-50%,-50%) rotate(45deg)}
.p.s::after{transform:translate(-50%,-50%) rotate(-45deg)}
.p.s.h{box-shadow:0 0 0 4px var(--told-soft)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:14px; color:var(--muted); font-size:.92rem}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:13px; height:13px; border-radius:50%; display:inline-block; position:relative}
.lg-idle{background:var(--idle)} .lg-told{background:var(--told)} .lg-spent{background:var(--spent)}
.lg-skep{border:2px solid var(--skeptic)}
.lg-skep::before{content:""; position:absolute; left:50%; top:50%; width:70%; height:2px; background:var(--skeptic); transform:translate(-50%,-50%) rotate(45deg)}

.side{display:grid; gap:16px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:14px}
.count{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.count b{font-family:var(--display); font-weight:700; font-size:3rem; line-height:1; color:var(--told); font-variant-numeric:tabular-nums}
.count span{color:var(--muted)}
.step{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.92rem}
.ctl-label{font-weight:700; font-size:1.05rem; display:block}
.dial{display:flex; gap:8px}
.dial button{flex:1; font-family:var(--display); font-weight:700; font-size:1.5rem; padding:10px 0; background:var(--desk); color:var(--ink); border:2px solid transparent; border-radius:10px; cursor:pointer; font-variant-numeric:tabular-nums}
.dial button[aria-pressed="true"]{background:var(--told); color:#fff; border-color:var(--told)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; background:var(--desk); border:2px solid transparent; border-radius:10px; padding:12px 14px; color:var(--ink); font:inherit; font-weight:700; font-size:1.05rem; cursor:pointer; text-align:left}
.switch .track{flex:none; width:48px; height:28px; border-radius:14px; background:var(--idle); position:relative; transition:background-color .2s}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--panel); transition:transform .2s}
.switch[aria-pressed="true"] .track{background:var(--skeptic)}
.switch[aria-pressed="true"] .track::after{transform:translateX(20px)}
.actions{display:flex; gap:10px}
.actions button{flex:1; font:inherit; font-weight:700; font-size:1.05rem; padding:12px; border-radius:10px; cursor:pointer}
#play{background:var(--ink); color:var(--panel); border:2px solid var(--ink)}
#reset{background:transparent; color:var(--ink); border:2px solid var(--line)}
button:focus-visible, textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.chart-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.chart-head h2{font-family:var(--display); font-weight:500; font-size:1.1rem; margin:0}
.keys{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
.keys span{display:inline-flex; align-items:center; gap:6px}
.keys i{width:18px; height:3px; border-radius:2px; display:inline-block}
.k-now{background:var(--told)} .k-prev{background:var(--ghost)}
canvas{width:100%; height:190px; display:block}

/* Panel de configuración: queda fuera de la vista principal */
.cfg-toggle{justify-self:start; background:none; border:none; color:var(--muted); font:inherit; font-size:.9rem; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px 0}
.cfg{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:12px}
.cfg h2{font-family:var(--display); font-weight:500; font-size:1.1rem; margin:0}
.cfg p{margin:0; color:var(--muted); max-width:65ch}
.cfg textarea{width:100%; min-height:320px; font-family:var(--mono); font-size:.85rem; line-height:1.5; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; resize:vertical}
.cfg .row{display:flex; gap:10px; flex-wrap:wrap}
.cfg .row button{font:inherit; font-weight:700; padding:10px 14px; border-radius:10px; cursor:pointer; background:var(--desk); color:var(--ink); border:2px solid var(--line)}
.cfg .row button.main{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.msg{font-size:.95rem; min-height:1.4em}
.msg.err{color:var(--warn)} .msg.ok{color:var(--muted)}

@media (prefers-reduced-motion: reduce){ .p,.switch .track,.switch .track::after{transition:none} .p.new{transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo"></h1>
    <p id="planteo"></p>
  </header>

  <div class="stage">
    <section class="floor" aria-label="Espacio de la simulación">
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="lg-idle"></i><span id="lgIdle"></span></span>
        <span><i class="lg-told"></i><span id="lgTold"></span></span>
        <span id="legSpent" hidden><i class="lg-spent"></i><span id="lgSpent"></span></span>
        <span id="legSkep" hidden><i class="lg-skep"></i><span id="lgSkep"></span></span>
      </div>
    </section>

    <div class="side">
      <div class="card">
        <div class="count"><b id="n">1</b><span>de <span id="total">140</span> <span id="contador"></span></span></div>
        <div class="step" id="step"></div>
      </div>
      <div class="card">
        <span class="ctl-label" id="dialLabel"></span>
        <div class="dial" role="group" aria-labelledby="dialLabel" id="dial"></div>
        <button type="button" class="switch" id="skep" aria-pressed="false">
          <span id="botonTexto"></span>
          <span class="track" aria-hidden="true"></span>
        </button>
        <div class="actions">
          <button type="button" id="play">Empezar</button>
          <button type="button" id="reset">Reiniciar</button>
        </div>
      </div>
      <div class="card">
        <div class="chart-head">
          <h2 id="grafico"></h2>
          <div class="keys">
            <span><i class="k-now"></i>Ahora</span>
            <span id="keyPrev" hidden><i class="k-prev"></i><span id="prevLabel">Anterior</span></span>
          </div>
        </div>
        <canvas id="chart" aria-label="Gráfico de la evolución en el tiempo"></canvas>
      </div>
    </div>
  </div>

  <button type="button" class="cfg-toggle" id="cfgToggle">Configuración</button>
  <section class="cfg" id="cfg" hidden aria-label="Configuración del simulador">
    <h2>Configuración</h2>
    <p>Pegá acá la configuración que te dio la IA y tocá Aplicar. Para conservar tu simulador, tocá Descargar: se guarda un archivo nuevo que podés abrir sin conexión.</p>
    <textarea id="cfgText" spellcheck="false" aria-label="Texto de configuración"></textarea>
    <div class="row">
      <button type="button" class="main" id="cfgApply">Aplicar</button>
      <button type="button" id="cfgSave">Descargar este simulador</button>
      <button type="button" id="cfgOrig">Volver a la original</button>
    </div>
    <div class="msg" id="cfgMsg" role="status"></div>
  </section>
</div>

<script>
(function(){
  // ===== Motor. No hace falta modificar nada de acá para abajo. =====
  const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
  const ORIGINAL_TEXT = document.getElementById('config').textContent.trim();
  const COLS=14, ROWS=10, N=COLS*ROWS, TICK=280, MAX_STEPS=120;
  const START=Math.floor(ROWS/2)*COLS+Math.floor(COLS/2)-1;
  const $=id=>document.getElementById(id);

  // ---- Validación de la configuración ----
  function isText(v,max){return typeof v==='string' && v.trim().length>0 && v.length<=max;}
  function validate(c){
    const e=[];
    if(!c||typeof c!=='object') return ['La configuración no tiene el formato esperado.'];
    if(!isText(c.titulo,80)) e.push('Falta "titulo" (hasta 80 caracteres).');
    if(!isText(c.planteo,140)) e.push('Falta "planteo" (hasta 140 caracteres).');
    if(!isText(c.unidadTiempo,20)) e.push('Falta "unidadTiempo", por ejemplo "Día" o "Semana".');
    const s=c.estados||{};
    ['sinContacto','activo','resistente'].forEach(k=>{if(!isText(s[k],40)) e.push('Falta "estados.'+k+'" (hasta 40 caracteres).');});
    if(!isText(c.contador,50)) e.push('Falta "contador" (hasta 50 caracteres).');
    if(!isText(c.grafico,60)) e.push('Falta "grafico" (hasta 60 caracteres).');
    const p=c.perilla||{};
    if(!isText(p.pregunta,60)) e.push('Falta "perilla.pregunta" (hasta 60 caracteres).');
    const r=c.reglas||{};
    const modo=r.modo===undefined?'contagio':r.modo;
    if(modo!=='contagio'&&modo!=='umbral') e.push('"reglas.modo" tiene que ser "contagio" o "umbral".');
    if(modo==='contagio' && p.controla!=='contactos' && p.controla!=='probabilidad') e.push('En modo "contagio", "perilla.controla" tiene que ser "contactos" o "probabilidad".');
    if(modo==='umbral' && p.controla!=='umbral' && p.controla!=='probabilidad') e.push('En modo "umbral", "perilla.controla" tiene que ser "umbral" o "probabilidad".');
    if(!Array.isArray(p.valores)||p.valores.length<2||p.valores.length>5||!p.valores.every(v=>typeof v==='number')) e.push('"perilla.valores" tiene que ser una lista de 2 a 5 números.');
    else if(p.controla==='contactos' && !p.valores.every(v=>Number.isInteger(v)&&v>=1&&v<=8)) e.push('Con "contactos", los valores de la perilla van de 1 a 8, enteros.');
    else if(p.controla==='umbral' && !p.valores.every(v=>Number.isInteger(v)&&v>=1&&v<=3)) e.push('Con "umbral", los valores de la perilla van de 1 a 3, enteros.');
    else if(p.controla==='probabilidad' && !p.valores.every(v=>v>0&&v<=100)) e.push('Con "probabilidad", los valores de la perilla son porcentajes entre 1 y 100.');
    if(Array.isArray(p.valores) && !p.valores.includes(p.inicial)) e.push('"perilla.inicial" tiene que ser uno de los valores de la perilla.');
    if(!isText(p.resumen,50)||p.resumen.indexOf('{valor}')<0) e.push('"perilla.resumen" tiene que incluir {valor}.');
    const b=c.boton||{};
    if(!isText(b.texto,60)) e.push('Falta "boton.texto" (hasta 60 caracteres).');
    if(typeof b.proporcion!=='number'||b.proporcion<0.05||b.proporcion>0.8) e.push('"boton.proporcion" tiene que estar entre 0.05 y 0.8.');
    if(!isText(b.resumenEncendido,50)||!isText(b.resumenApagado,50)) e.push('Faltan "boton.resumenEncendido" o "boton.resumenApagado".');
    if(modo==='umbral' && p.controla!=='umbral' && !(Number.isInteger(r.umbral)&&r.umbral>=1&&r.umbral<=3)) e.push('En modo "umbral", si la perilla no controla el umbral, "reglas.umbral" va de 1 a 3.');
    if(modo==='umbral' && r.diasActivo!==null && r.diasActivo!==undefined) e.push('En modo "umbral", "reglas.diasActivo" tiene que ser null.');
    if(!Number.isInteger(r.contactosPorDia)||r.contactosPorDia<1||r.contactosPorDia>8) e.push('"reglas.contactosPorDia" va de 1 a 8.');
    if(typeof r.probabilidad!=='number'||r.probabilidad<=0||r.probabilidad>1) e.push('"reglas.probabilidad" va de 0 a 1 (1 = siempre).');
    if(r.diasActivo!==null && !(Number.isInteger(r.diasActivo)&&r.diasActivo>=1&&r.diasActivo<=30)) e.push('"reglas.diasActivo" es null o un entero de 1 a 30.');
    if(r.diasActivo!==null && !isText(s.agotado,40)) e.push('Si hay "diasActivo", falta "estados.agotado".');
    if(modo==='contagio' && (!Number.isInteger(r.iniciales)||r.iniciales<1||r.iniciales>5)) e.push('En modo "contagio", "reglas.iniciales" va de 1 a 5.');
    if(modo==='umbral' && (!Number.isInteger(r.iniciales)||r.iniciales<4||r.iniciales>12)) e.push('En modo "umbral", "reglas.iniciales" va de 4 a 12.');
    return e;
  }

  // ---- Estado de la simulación ----
  let C, state, heard, since, series, step, timer=null, val, skeptics=false, prev=null, done=false;
  const gridEl=$('grid'), cells=[];
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='desk';const p=document.createElement('div');p.className='p';d.appendChild(p);gridEl.appendChild(d);cells.push(p);}
  $('total').textContent=N;
  const nbs=[];
  for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS,o=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS)o.push(rr*COLS+cc);}
    nbs.push(o);}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  const sr=Math.floor(START/COLS), sc=START%COLS;
  const NEAR=[...Array(N).keys()].sort((a,b)=>{const d=i=>(Math.floor(i/COLS)-sr)**2+(i%COLS-sc)**2;return d(a)-d(b)||a-b;});
  function modo(){return C.reglas.modo||'contagio';}
  function threshold(){return C.perilla.controla==='umbral'?val:C.reglas.umbral;}
  function activeAround(i){let n=0;for(const j of nbs[i])if(state[j]===1)n++;return n;}
  function contacts(){return C.perilla.controla==='contactos'?val:C.reglas.contactosPorDia;}
  function chance(){return C.perilla.controla==='probabilidad'?val/100:C.reglas.probabilidad;}
  function fmt(v){return C.perilla.controla==='probabilidad'?v+'%':String(v);}

  // estados: 0 sin contacto, 1 activo, 2 resistente, 3 agotado
  function setup(){
    state=new Array(N).fill(0); heard=new Array(N).fill(false); since=new Array(N).fill(0);
    // En modo umbral los iniciales forman un grupo; en contagio, el primero está en el centro y el resto al azar
    const cluster=modo()==='umbral'?NEAR.slice(0,C.reglas.iniciales):[START];
    if(skeptics){
      do{ for(let i=0;i<N;i++) state[i]=(!cluster.includes(i)&&Math.random()<C.boton.proporcion)?2:0; }
      while(modo()==='contagio' && nbs[START].filter(j=>state[j]===0).length<3);
    }
    const seeds=cluster.slice();
    if(modo()==='contagio' && C.reglas.iniciales>1){
      const pool=shuffle([...Array(N).keys()].filter(i=>i!==START&&state[i]===0));
      seeds.push(...pool.slice(0,C.reglas.iniciales-1));
    }
    seeds.forEach(i=>state[i]=1);
    step=0; done=false; series=[seeds.length];
    render(seeds); updateNumbers(); drawChart();
    $('legSkep').hidden=!skeptics;
    $('play').textContent='Empezar';
  }
  function render(fresh){
    for(let i=0;i<N;i++){const p=cells[i];
      p.classList.toggle('k',state[i]===1); p.classList.toggle('x',state[i]===3);
      p.classList.toggle('s',state[i]===2); p.classList.toggle('h',state[i]===2&&heard[i]);
      p.classList.remove('new');}
    if(fresh){fresh.forEach(i=>cells[i].classList.add('new'));setTimeout(()=>fresh.forEach(i=>cells[i].classList.remove('new')),300);}
  }
  // El gráfico cuenta a todos los que alguna vez se enteraron (activos + agotados)
  function reached(){let n=0;for(let i=0;i<N;i++)if(state[i]===1||state[i]===3)n++;return n;}
  function canSpread(){
    if(modo()==='umbral'){const T=threshold();for(let i=0;i<N;i++)if(state[i]===0&&activeAround(i)>=T)return true;return false;}
    for(let i=0;i<N;i++)if(state[i]===1&&nbs[i].some(j=>state[j]===0))return true;return false;
  }

  function tick(){
    if(!canSpread()||step>=MAX_STEPS){finish();return;}
    const fresh=[], k=contacts(), q=chance();
    if(modo()==='umbral'){
      // Cada uno mira a sus vecinos: si suficientes ya lo adoptaron, puede sumarse
      const T=threshold();
      for(let i=0;i<N;i++){
        if(state[i]===0&&activeAround(i)>=T&&Math.random()<q)fresh.push(i);
        else if(state[i]===2&&activeAround(i)>0)heard[i]=true;
      }
    } else for(let i=0;i<N;i++){
      if(state[i]!==1)continue;
      shuffle(nbs[i].slice()).slice(0,k).forEach(j=>{
        if(state[j]===0&&Math.random()<q&&!fresh.includes(j))fresh.push(j);
        else if(state[j]===2)heard[j]=true;
      });
    }
    if(C.reglas.diasActivo!==null){
      for(let i=0;i<N;i++) if(state[i]===1){since[i]++; if(since[i]>=C.reglas.diasActivo) state[i]=3;}
    }
    fresh.forEach(j=>{state[j]=1;since[j]=0;});
    step++; series.push(reached());
    render(fresh); updateNumbers(); drawChart();
    if(!canSpread())finish();
  }
  function finish(){done=true;stop();$('play').textContent='Terminó';}
  function start(){if(done)return;timer=setInterval(tick,TICK);$('play').textContent='Pausa';}
  function stop(){clearInterval(timer);timer=null;if(!done)$('play').textContent=step?'Seguir':'Empezar';}
  function updateNumbers(){$('n').textContent=reached();$('step').textContent=C.unidadTiempo+' '+step;}
  function label(){return C.perilla.resumen.replace('{valor}',fmt(val))+' · '+(skeptics?C.boton.resumenEncendido:C.boton.resumenApagado);}
  function archive(){
    if(series&&series.length>1){prev={series:series.slice(),label:label()};
      $('keyPrev').hidden=false; $('prevLabel').textContent='Anterior: '+prev.label;}
  }

  // ---- Aplicar textos de la configuración a la interfaz ----
  function apply(cfg){
    stop(); C=cfg; val=C.perilla.inicial; skeptics=false; prev=null;
    document.title=C.titulo;
    $('titulo').textContent=C.titulo; $('planteo').textContent=C.planteo;
    $('lgIdle').textContent=C.estados.sinContacto; $('lgTold').textContent=C.estados.activo;
    $('lgSkep').textContent=C.estados.resistente;
    $('legSpent').hidden=C.reglas.diasActivo===null; $('lgSpent').textContent=C.estados.agotado||'';
    $('contador').textContent=C.contador; $('grafico').textContent=C.grafico;
    $('dialLabel').textContent=C.perilla.pregunta; $('botonTexto').textContent=C.boton.texto;
    $('skep').setAttribute('aria-pressed','false'); $('keyPrev').hidden=true;
    const dial=$('dial'); dial.innerHTML='';
    C.perilla.valores.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.id='v'+i;
      b.textContent=fmt(v); b.setAttribute('aria-pressed',v===val?'true':'false');
      b.addEventListener('click',()=>{val=v;dial.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));});
      dial.appendChild(b);});
    setup();
  }

  $('play').addEventListener('click',()=>{if(done)return;timer?stop():start();});
  $('reset').addEventListener('click',()=>{stop();archive();setup();});
  $('skep').addEventListener('click',e=>{stop();archive();skeptics=!skeptics;e.currentTarget.setAttribute('aria-pressed',skeptics?'true':'false');setup();});

  // ---- Gráfico ----
  const cv=$('chart'), ctx=cv.getContext('2d');
  function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
  function drawChart(){
    const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w)return;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const padL=34,padR=10,padT=10,padB=26, pw=w-padL-padR, ph=h-padT-padB;
    const xMax=Math.max(30, series.length-1, prev?prev.series.length-1:0);
    const X=s=>padL+pw*s/xMax, Y=v=>padT+ph*(1-v/N);
    ctx.font='12px '+tok('--body'); ctx.fillStyle=tok('--muted'); ctx.strokeStyle=tok('--line'); ctx.lineWidth=1;
    [0,N/2,N].forEach(v=>{ctx.beginPath();ctx.moveTo(padL,Y(v));ctx.lineTo(w-padR,Y(v));ctx.stroke();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(v,padL-6,Y(v));});
    ctx.textAlign='center';ctx.textBaseline='top';
    const tickStep=xMax>60?20:10;
    for(let s=0;s<=xMax;s+=tickStep)ctx.fillText(s===0?C.unidadTiempo.toLowerCase()+' 0':s,X(s),h-padB+7);
    function line(d,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.beginPath();d.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();}
    if(prev){ctx.setLineDash([5,4]);line(prev.series,tok('--ghost'),2);ctx.setLineDash([]);}
    line(series,tok('--told'),3);
    const last=series.length-1; ctx.fillStyle=tok('--told'); ctx.beginPath(); ctx.arc(X(last),Y(series[last]),4.5,0,7); ctx.fill();
  }
  window.addEventListener('resize',drawChart);
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawChart);}catch(e){}
  new MutationObserver(drawChart).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // ---- Panel de configuración ----
  const msg=(t,err)=>{$('cfgMsg').textContent=t;$('cfgMsg').className='msg '+(err?'err':'ok');};
  function readPanel(){
    let txt=$('cfgText').value.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
    let cfg; try{cfg=JSON.parse(txt);}catch(e){msg('El texto no se pudo leer. Revisá que esté completo, desde la primera llave { hasta la última }.',true);return null;}
    const errs=validate(cfg); if(errs.length){msg(errs.join(' '),true);return null;}
    return {cfg,txt};
  }
  $('cfgToggle').addEventListener('click',()=>{const p=$('cfg');p.hidden=!p.hidden;if(!p.hidden)$('cfgText').value=JSON.stringify(C,null,2);});
  $('cfgApply').addEventListener('click',()=>{const r=readPanel();if(!r)return;apply(r.cfg);msg('Listo. Ya estás usando la nueva configuración. Si cerrás la página se pierde: descargala para conservarla.');});
  $('cfgOrig').addEventListener('click',()=>{apply(JSON.parse(ORIGINAL_TEXT));$('cfgText').value=JSON.stringify(C,null,2);msg('Volviste a la configuración original del archivo.');});
  $('cfgSave').addEventListener('click',()=>{
    const r=readPanel();if(!r)return; apply(r.cfg);
    const html=PRISTINE.replace(/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/,'$1\n'+JSON.stringify(r.cfg,null,2)+'\n$2');
    try{
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      a.download=r.cfg.titulo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html';
      document.body.appendChild(a); a.click(); a.remove();
      msg('Se descargó el archivo '+a.download+'. Abrilo con el navegador, funciona sin conexión.');
    }catch(e){msg('Este navegador no permitió la descarga. Copiá el texto de configuración y guardalo.',true);}
  });

  // ---- Arranque ----
  let initial;
  try{initial=JSON.parse(ORIGINAL_TEXT);}catch(e){initial=null;}
  const errs=initial?validate(initial):['La configuración del archivo no se pudo leer.'];
  if(errs.length){
    document.body.insertAdjacentHTML('afterbegin','<p style="color:var(--warn);font-weight:700;max-width:1120px;margin:0 auto 16px">Hay un problema en la configuración de este archivo: '+errs.join(' ').replace(/</g,'&lt;')+'</p>');
    initial=JSON.parse('{"titulo":"Configuración con errores","planteo":"Abrí Configuración, abajo de todo, para corregirla.","unidadTiempo":"Día","estados":{"sinContacto":"Sin contacto","activo":"Activo","resistente":"Resistente","agotado":"Agotado"},"contador":"alcanzados","grafico":"Evolución","perilla":{"pregunta":"Contactos por día","controla":"contactos","valores":[1,2,3,4],"inicial":1,"resumen":"{valor} contactos"},"boton":{"texto":"Agregar resistentes","proporcion":0.35,"resumenEncendido":"con resistentes","resumenApagado":"sin resistentes"},"reglas":{"contactosPorDia":1,"probabilidad":1,"diasActivo":null,"iniciales":1}}');
  }
  apply(initial);
})();
</script>
</body>
</html>
