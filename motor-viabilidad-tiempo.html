.ctl-value .months { font-size: 26px; }

<div class="wrap">
  <a class="home" href="index.html">← Volver al inicio</a>
  <header class="top">

    <button type="button" class="btn" id="openTheory"></button>
  </header>

  <main class="stage">
    <section class="panel controls" aria-labelledby="controlsTitle">
      <div class="panel-head">
        <h2 class="eyebrow" id="controlsTitle"></h2>
        <span class="note" id="controlsNote"></span>
      </div>
      <div class="divide">
        <div id="controlList" class="divide" style="padding:0"></div>
        <div class="run">
          <div class="run-top">
            <p class="eyebrow">Corrida</p>
            <span class="run-step" aria-live="off"><span id="stepUnit"></span> <span id="stepNow">0</span><span class="unit"> de <span id="stepMax">48</span></span></span>
          </div>
          <div class="progress" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-mark" id="progressMark"></div>
          </div>
          <p class="progress-legend" id="progressLegend"></p>
          <div class="actions">
            <button type="button" class="btn" id="play">Empezar</button>
            <button type="button" class="btn-ghost" id="skip">Ir al final</button>
            <button type="button" class="btn-ghost" id="reset">Reiniciar</button>
          </div>
        </div>
      </div>
    </section>
    <div class="readout">
      <div id="status" aria-live="polite"></div>
      <section class="panel" aria-labelledby="chartTitle">
        <div class="panel-head">
          <h2 class="eyebrow" id="chartTitle"></h2>
          <span class="note" id="prevNote" hidden></span>
        </div>
        <div class="chart-wrap">
          <div class="keys" id="keys"></div>
          <canvas class="chart" id="chart" role="img" aria-label="Gráfico de confianza, capacidad local y funcionamiento en el tiempo"></canvas>
        </div>
      </section>
      <section class="panel" aria-labelledby="dashTitle">
        <div class="panel-head">
          <h2 class="eyebrow" id="dashTitle"></h2>
          <span class="note" id="dashNote"></span>
        </div>
        <div class="divide" id="meters"></div>
      </section>
    </div>
  </main>

  <button type="button" class="cfg-toggle" id="cfgToggle">Configuración</button>
  <section class="cfg" id="cfg" hidden aria-label="Configuración del simulador">
    <h2>Configuración</h2>
    <p>Pegá acá la configuración que te dio la IA y tocá Aplicar. Para conservar tu simulador, tocá Descargar: se guarda un archivo nuevo que podés abrir sin conexión.</p>
    <textarea id="cfgText" spellcheck="false" aria-label="Texto de configuración"></textarea>
    <div class="row">
      <button type="button" class="main" id="cfgApply">Aplicar</button>
      <button type="button" id="cfgSave">Descargar este simulador</button>
      <button type="button" id="cfgOrig">Volver a la original</button>
    </div>
    <div class="msg" id="cfgMsg" role="status"></div>
  </section>
</div>
<div id="modal" class="modal-back" hidden></div>

    const padL = 34, padR = 10, padT = 14, padB = 26, pw = w - padL - padR, ph = hh - padT - padB, dur = C.duracion;
    const X = function (s) { return padL + pw * s / dur; }, Y = function (v) { return padT + ph * (1 - v / 100); };
    const body = tok('--font-body');
    ctx.font = '12px ' + body; ctx.fillStyle = tok('--muted'); ctx.strokeStyle = tok('--line'); ctx.lineWidth = 1;
    [0, 50, 100].forEach(function (v) {
      ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), padL - 6, Y(v));
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const tickStep = dur <= 36 ? 6 : dur <= 72 ? 12 : 24;
    for (let s = 0; s <= dur; s += tickStep) ctx.fillText(s === 0 ? C.unidadTiempo.toLowerCase() + ' 0' : String(s), X(s), hh - padB + 7);
    // exigencia de la tecnología
    ctx.setLineDash([6, 5]); ctx.strokeStyle = tok('--s-cap'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, Y(sim.exigencia)); ctx.lineTo(w - padR, Y(sim.exigencia)); ctx.stroke();
    // retiro del equipo
    const xr = X(Math.min(sim.R, dur));
    ctx.strokeStyle = tok('--ink'); ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(xr, padT); ctx.lineTo(xr, padT + ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '600 11.5px ' + body; ctx.textBaseline = 'top';
    const rightRoom = w - padR - xr > 150;
    ctx.fillStyle = tok('--ink'); ctx.textAlign = rightRoom ? 'left' : 'right';
    ctx.fillText(C.lineas.retiro, xr + (rightRoom ? 6 : -6), padT);
    ctx.fillStyle = tok('--s-cap'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(C.lineas.exigencia, w - padR - 2, Y(sim.exigencia) - 3);
    function line(d, upto, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();
      for (let i = 0; i <= upto && i < d.length; i++) { if (i) ctx.lineTo(X(i), Y(d[i])); else ctx.moveTo(X(i), Y(d[i])); }
      ctx.stroke();
    }
    if (prev) { ctx.setLineDash([5, 4]); line(prev.F, prev.F.length - 1, tok('--ghost'), 2); ctx.setLineDash([]); }
    line(sim.C, step, tok('--s-conf'), 2);
    line(sim.K, step, tok('--s-cap'), 2);
    line(sim.F, step, tok('--s-func'), 3.5);
    ctx.fillStyle = tok('--s-func'); ctx.beginPath(); ctx.arc(X(step), Y(sim.F[step]), 4.5, 0, 7); ctx.fill();
  }
  window.addEventListener('resize', drawChart);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawChart); } catch (e) {}
  new MutationObserver(drawChart).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---- Marco teórico ----
  let onModalKey = null;
  function closeTheory() {
    const modal = $('modal');
    if (onModalKey) document.removeEventListener('keydown', onModalKey);
    onModalKey = null;
    modal.hidden = true; modal.replaceChildren(); document.body.style.overflow = '';
    $('openTheory').focus();
  }
  function openTheory() {
    const t = C.teoria, modal = $('modal');
    const close = h('button', { type: 'button', class: 'btn-ghost', 'aria-label': 'Cerrar marco teórico', text: 'Cerrar' });
    close.addEventListener('click', closeTheory);
    const principles = h('div', { class: 'principles' });
    t.principios.forEach(function (p) { principles.appendChild(h('div', { class: 'principle' }, [h('h3', { text: p.titulo }), h('p', { text: p.texto })])); });
    const rules = h('dl');
    t.reglas.forEach(function (r) { rules.appendChild(h('div', { class: 'rule' }, [h('dt', { text: r.nombre }), h('dd', { text: r.condicion })])); });
    modal.replaceChildren(h('div', { class: 'modal-panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'theory-title' }, [
      h('div', { class: 'modal-head' }, [h('div', null, [h('p', { class: 'eyebrow', text: t.eyebrow }), h('h2', { id: 'theory-title', text: t.titulo })]), close]),
      h('p', { class: 'intro', text: t.intro }),
      principles,
      h('div', { class: 'callout' }, [h('h3', { text: t.solucionismoTitulo }), h('p', { text: t.solucionismo })]),
      h('h3', { text: t.modeloTitulo }),
      rules,
      h('p', { class: 'nota', text: t.nota })
    ]));
    modal.hidden = false; document.body.style.overflow = 'hidden'; close.focus();
    onModalKey = function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); closeTheory(); return; }
      if (ev.key !== 'Tab') return;
      const items = modal.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onModalKey);
  }
  $('openTheory').addEventListener('click', openTheory);
  $('modal').addEventListener('mousedown', function (ev) { if (ev.target === ev.currentTarget) closeTheory(); });

  // ---- Aplicar configuración ----
  function apply(cfg) {
    if (!$('modal').hidden) closeTheory();
    stop();
    C = cfg;
    values = { tech: cfg.inicial.tech, part: cfg.inicial.part, time: cfg.inicial.time };
    prev = null; $('prevNote').hidden = true;
    document.title = cfg.titulo;
    $('eyebrow').textContent = cfg.eyebrow;
    $('titulo').textContent = cfg.titulo;
    $('bajada').textContent = cfg.bajada;
    $('openTheory').textContent = cfg.botonTeoria;
    $('controlsTitle').textContent = cfg.controlesTitulo;
    $('controlsNote').textContent = cfg.controlesNota;
    $('dashTitle').textContent = cfg.dashboardTitulo;
    $('dashNote').textContent = cfg.dashboardNota;
    $('chartTitle').textContent = cfg.graficoTitulo;
    $('stepUnit').textContent = cfg.unidadTiempo;
    $('stepMax').textContent = String(cfg.duracion);
    buildControls(); buildMeters(); buildKeys();
    setup();
  }

  $('play').addEventListener('click', function () { if (done) return; if (timer) stop(); else start(); });
  $('skip').addEventListener('click', function () { if (done) return; stop(); step = C.duracion; paintRun(); paintMeters(); drawChart(); finish(); });
  $('reset').addEventListener('click', function () { archive(); setup(); });

  // ---- Panel de configuración ----
  const msg = function (text, err) { $('cfgMsg').textContent = text; $('cfgMsg').className = 'msg ' + (err ? 'err' : 'ok'); };
  function readPanel() {
    const txt = $('cfgText').value.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
    let cfg;
    try { cfg = JSON.parse(txt); }
    catch (e) { msg('El texto no se pudo leer. Revisá que esté completo, desde la primera llave { hasta la última }.', true); return null; }
    const errs = validate(cfg);
    if (errs.length) { msg(errs.join(' '), true); return null; }
    return { cfg: cfg };
  }
  $('cfgToggle').addEventListener('click', function () {
    const panel = $('cfg');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) $('cfgText').value = C ? JSON.stringify(C, null, 2) : ORIGINAL_TEXT;
  });
  $('cfgApply').addEventListener('click', function () {
    const read = readPanel(); if (!read) return;
    apply(read.cfg);
    msg('Listo. Ya estás usando la nueva configuración. Si cerrás la página se pierde: descargala para conservarla.');
  });
  $('cfgOrig').addEventListener('click', function () {
    let cfg;
    try { cfg = JSON.parse(ORIGINAL_TEXT); } catch (e) { msg('La configuración original de este archivo no se pudo leer.', true); return; }
    const errs = validate(cfg); if (errs.length) { msg(errs.join(' '), true); return; }
    apply(cfg); $('cfgText').value = JSON.stringify(cfg, null, 2);
    msg('Volviste a la configuración original del archivo.');
  });
  $('cfgSave').addEventListener('click', function () {
    const read = readPanel(); if (!read) return;
    apply(read.cfg);
    const html = PRISTINE.replace(/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/, '$1\n' + JSON.stringify(read.cfg, null, 2) + '\n$2');
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = read.cfg.titulo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      msg('Se descargó el archivo ' + a.download + '. Abrilo con el navegador, funciona sin conexión.');
    } catch (e) { msg('Este navegador no permitió la descarga. Copiá el texto de configuración y guardalo.', true); }
  });

  // ---- Arranque ----
  function banner(errs) {
    const p = document.createElement('p');
    p.className = 'banner';
    p.textContent = 'Hay un problema en la configuración de este archivo: ' + errs.join(' ') + ' Abrí Configuración, abajo de todo, para corregirla.';
    document.body.insertBefore(p, document.body.firstChild);
  }
  function parseCfg(text) { try { return JSON.parse(text); } catch (e) { return null; } }
  const initial = parseCfg(ORIGINAL_TEXT);
  const errs = initial ? validate(initial) : ['La configuración del archivo no se pudo leer.'];
  if (errs.length) {
    banner(errs);
    $('cfg').hidden = false; $('cfgText').value = ORIGINAL_TEXT;
    const fallback = parseCfg(DEFAULT_TEXT);
    if (fallback && !validate(fallback).length) apply(fallback);
  } else apply(initial);
})();
</script>
</body>
