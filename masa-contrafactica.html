<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La masa contrafáctica</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#203029;background:#f3f6f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:30px 18px}h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:8px 0}p{line-height:1.55}.sub{color:#53675a}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.panel{background:white;border:1px solid #d6e0d6;border-radius:17px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #20302908}h2{font-size:1.15rem;margin:0 0 20px}.control{margin:22px 0}.control label{font-weight:650;display:flex;justify-content:space-between;gap:12px}.value{font-variant-numeric:tabular-nums;color:#086c69;font-size:1.25rem}.ends{display:flex;justify-content:space-between;gap:15px;font-size:.76rem;color:#53675a}.ends span:last-child{text-align:right}input[type=range]{width:100%;accent-color:#0a7770;cursor:pointer;margin:13px 0}.meter{margin:20px 0}.meter-head{display:flex;justify-content:space-between;gap:8px;font-weight:600}.track{height:15px;background:#e4eae4;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:50%;transition:width .15s}.green{background:#278558}.yellow{background:#daa13b}.red{background:#c84d42}.status{border-left:5px solid #087f6a}.status h2{font-size:1.45rem}.muted{color:#5b6b60;font-size:.9rem}.button{background:#096d67;border:0;color:#fff;padding:12px 16px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}#explainer[hidden]{display:none}.rule{padding:10px 0;border-bottom:1px solid #e2e9e2}.tree{font-size:1.5rem;text-align:center;line-height:1.8;margin:12px 0;color:#397451}.question{font-style:italic}.foot{font-size:.85rem;color:#546458}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="sub">Simulador de experimentación contrafáctica · Uso sin conexión</div><h1 id="title"></h1><p id="intro"></p><div class="layout"><div><section class="panel"><h2>Variables que podés modificar</h2><div id="controls"></div></section><section class="panel"><button class="button" id="toggle" aria-expanded="false" aria-controls="explainer">Cómo funciona el modelo</button><div id="explainer" hidden></div></section></div><div><section class="panel status" aria-live="polite"><div id="symbol"></div><h2 id="ending"></h2><p id="question" class="question"></p></section><section class="panel"><h2>Resultados</h2><div id="results"></div></section></div></div><p class="foot" id="note"></p></main><script id="data" type="application/json">{"title": "La masa contrafáctica", "intro": "Formación de la red de gluten: experimentá con la hidratación, el amasado y la capacidad de la harina para formar gluten.", "controls": [{"id": "agua", "name": "Hidratación", "low": "Muy poca agua", "high": "Mucha agua"}, {"id": "amasado", "name": "Amasado (energía)", "low": "Amasado mínimo", "high": "Amasado prolongado"}, {"id": "harina", "name": "Capacidad de formar gluten", "low": "Harina sin gluten", "high": "Harina de trigo con gluten"}], "results": [{"id": "red", "name": "Desarrollo de la red de gluten", "inverse": false}, {"id": "elasticidad", "name": "Elasticidad", "inverse": false}, {"id": "extensibilidad", "name": "Extensibilidad", "inverse": false}], "weights": {"red": [1, 1, 2], "elasticidad": [-1, 1, 1], "extensibilidad": [1, 1, 0]}, "endings": [{"name": "Masa con red de gluten desarrollada", "conditions": [["harina", ">=", 7], ["agua", ">=", 4], ["agua", "<=", 7], ["amasado", ">=", 6], ["amasado", "<=", 8]], "question": "¿Qué pasaría si utilizáramos otra harina manteniendo las mismas cantidades de agua y el mismo amasado?"}, {"name": "Masa seca y compacta", "conditions": [["agua", "<=", 3]], "question": "¿Qué pasaría si aumentáramos progresivamente la cantidad de agua sin modificar la harina?"}, {"name": "Masa excesivamente hidratada", "conditions": [["agua", ">=", 8]], "question": "¿Qué pasaría si mantuviéramos la cantidad de agua, pero cambiáramos el tipo de harina?"}, {"name": "Masa sin red de gluten convencional", "conditions": [["harina", "<=", 4]], "question": "¿Qué pasaría si aplicáramos el mismo tiempo de amasado utilizado con harina de trigo?"}], "excluded": "Fermentación, temperatura, grasas, azúcares y otros aditivos; particularidades de cada variedad de harina y cocción.", "note": "Modelo didáctico simplificado. La hidratación y el amasado tienen respuestas no lineales en la realidad; los medidores muestran relaciones lineales aproximadas y no son mediciones experimentales.", "tree": false}</script><script>(function(){'use strict';const D=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);const values=Object.fromEntries(D.controls.map(c=>[c.id,5]));$('title').textContent=D.title;$('intro').textContent=D.intro;$('note').textContent=D.note;const mk=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};for(const c of D.controls){const div=mk('div',null,'control');const label=mk('label');label.htmlFor='control-'+c.id;label.append(mk('span',c.name));const val=mk('span','5','value');label.append(val);const input=document.createElement('input');input.type='range';input.min=1;input.max=10;input.step=1;input.value=5;input.id='control-'+c.id;input.setAttribute('aria-label',c.name);input.addEventListener('input',()=>{values[c.id]=Number(input.value);val.textContent=input.value;update()});const ends=mk('div',null,'ends');ends.append(mk('span','1 · '+c.low),mk('span','10 · '+c.high));div.append(label,input,ends);$('controls').append(div)}for(const r of D.results){const box=mk('div',null,'meter');const head=mk('div',null,'meter-head');head.append(mk('span',r.name));const num=mk('span','50 / 100');num.id='num-'+r.id;head.append(num);const bar=mk('div',null,'track');const fill=mk('div',null,'fill yellow');fill.id='fill-'+r.id;bar.append(fill);box.append(head,bar);$('results').append(box)}const desc={2:'sube mucho',1:'sube',0:'no cambia','-1':'baja','-2':'baja mucho'};const opnames={'<=':'≤','>=':'≥','<':'<','>':'>'};const controlsById=Object.fromEntries(D.controls.map(c=>[c.id,c]));function meets(e){return e.conditions.every(([id,op,n])=>op==='>='?values[id]>=n:op==='<='?values[id]<=n:op==='>'?values[id]>n:values[id]<n)}function metrics(){return D.results.map(r=>{let total=0,denom=0;D.controls.forEach((c,i)=>{const weight=D.weights[r.id][i];denom+=Math.abs(weight);total+=weight*(values[c.id]-5.5)/4.5});const score=denom?Math.max(0,Math.min(100,50+50*total/denom)):50;return {...r,score}})}function weakest(){let chosen=null;for(let i=0;i<D.controls.length;i++){let loss=0;for(const r of D.results){const w=D.weights[r.id][i]*(r.inverse?-1:1);loss+=-w*(values[D.controls[i].id]-5.5)/4.5}if(!chosen||loss>chosen.loss)chosen={name:D.controls[i].name,loss}}return chosen.name}function update(){const metricsNow=metrics();metricsNow.forEach(r=>{const rounded=Math.round(r.score);$('num-'+r.id).textContent=rounded+' / 100';const fill=$('fill-'+r.id);fill.style.width=r.score+'%';const beneficial=r.inverse?100-r.score:r.score;fill.className='fill '+(beneficial>=65?'green':beneficial>=35?'yellow':'red')});const matched=D.endings.find(meets);$('ending').textContent=matched?matched.name:'Zona intermedia';$('question').textContent=matched?matched.question:'Variable que más perjudica a los resultados: '+weakest()+'.';$('symbol').textContent=D.tree?'🌳 Raíces → Tronco → Ramas → Hojas → Frutos':'🥣 Ingredientes → Amasado → Propiedades → Comparación';$('symbol').className='tree'}function describe(){const area=$('explainer');area.replaceChildren(mk('h3','Relaciones del modelo'));for(let i=0;i<D.controls.length;i++){const c=D.controls[i];const relationships=D.results.map(r=>r.name+': '+desc[D.weights[r.id][i]]).join(' · ');area.append(mk('div','Si aumenta '+c.name.toLowerCase()+': '+relationships,'rule'))}area.append(mk('h3','Condiciones de los finales'));D.endings.forEach(e=>{const s=e.conditions.map(([id,op,n])=>controlsById[id].name+' '+opnames[op]+' '+n).join(' y ');area.append(mk('div',e.name+': '+s+'. Pregunta: '+e.question,'rule'))});area.append(mk('h3','Qué queda afuera'));area.append(mk('p',D.excluded));area.append(mk('p','Los finales se revisan en el orden presentado: si coinciden varios, aparece el primero. Mucho: 7–10; poco: 1–4, salvo condiciones numéricas específicas. Los medidores usan aportes lineales de las variables y se normalizan entre 0 y 100.','muted'));area.append(mk('p',D.note,'muted'))}$('toggle').addEventListener('click',()=>{const open=$('explainer').hidden;$('explainer').hidden=!open;$('toggle').setAttribute('aria-expanded',String(open));if(open)describe()});update()})();</script></body></html>
